[package]
name = "car-game"
version = "0.1.0"
edition = "2024"
default-run = "car-game"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "ui_bevy_render", "bevy_audio", "wav", "keyboard", "mouse"] }
bevy_rapier3d = { version = "0.37", default-features = false, features = ["dim3", "simd8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ctrlc = { version = "3.5.2", features = ["termination"] }
time = { version = "0.3", features = ["formatting"] }

# sha2 0.10 gates its ARM SHA-256 intrinsics behind this feature. Enable only
# on the tested macOS ARM platform; other targets keep their existing backend.
[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Keep CI compilation cheap while retaining debug assertions and overflow checks.
# Runtime hot paths stay optimized below; build tools stay fast for macro expansion.
# Dev/test/release settings and the complete feature graph are unchanged.
[profile.ci]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false

[profile.ci.build-override]
opt-level = 1
codegen-units = 16

# Preserve physics, scheduling and math throughput on the small macOS runner.
[profile.ci.package.bevy_ecs]
opt-level = 1
[profile.ci.package.bevy_app]
opt-level = 1
[profile.ci.package.bevy_tasks]
opt-level = 1
[profile.ci.package.bevy_time]
opt-level = 1
[profile.ci.package.bevy_math]
opt-level = 1
[profile.ci.package.bevy_transform]
opt-level = 1
[profile.ci.package.bevy_utils]
opt-level = 1
[profile.ci.package.bevy_platform]
opt-level = 1
[profile.ci.package.bevy_rapier3d]
opt-level = 1
[profile.ci.package.rapier3d]
opt-level = 1
[profile.ci.package.parry3d]
opt-level = 1
[profile.ci.package.nalgebra]
opt-level = 1
[profile.ci.package.glam]
opt-level = 1
[profile.ci.package.simba]
opt-level = 1

# Provenance hashes the executable and prepared assets before simulation startup.
# Keep that bounded production path optimized even in cold CI builds.
[profile.ci.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
