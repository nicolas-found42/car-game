[package]
name = "car-game"
version = "0.1.0"
edition = "2024"
default-run = "car-game"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "ui_bevy_render", "bevy_audio", "wav", "keyboard", "mouse"] }
bevy_rapier3d = { version = "0.37", default-features = false, features = ["dim3", "simd8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ctrlc = { version = "3.5.2", features = ["termination"] }
time = { version = "0.3", features = ["formatting"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Basic dependency optimization keeps CI executables compact: every recorder
# hashes/captures its executable. Local dev/test/release profiles are unchanged.
[profile.ci]
inherits = "dev"
incremental = false
debug = 0
[profile.ci.package."*"]
opt-level = 1

# Provenance hashes the executable and prepared assets before simulation startup.
# Keep that bounded production path optimized even in cold CI builds.
[profile.ci.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
