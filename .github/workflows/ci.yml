name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: car_game=debug,bevy_asset=warn,wgpu=error,naga=warn
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1 is the base tip for PR merge commits and the previous commit on push.
          fetch-depth: 2
      - name: Install Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Manual dispatches may seed/verify the cache; PRs only restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Format
        run: |
          mkdir -p artifacts/logs
          cargo fmt --check 2>&1 | tee artifacts/logs/cargo-fmt.log
      - name: Baseline serial and concurrent controls
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          { sw_vers; sysctl -n hw.ncpu; rustc -Vv; git rev-parse HEAD; } > artifacts/logs/workload.txt
          cargo test --profile ci --config 'profile.ci.package.sha2.opt-level=0' --test recorder_shutdown --no-run 2>&1 | tee artifacts/logs/baseline-build.log
          set +e
          cargo test --profile ci --config 'profile.ci.package.sha2.opt-level=0' --test recorder_shutdown -- --test-threads=1 --nocapture 2>&1 | tee artifacts/logs/baseline-serial.log
          echo "serial_exit=${PIPESTATUS[0]}" >> artifacts/logs/workload.txt
          cargo test --profile ci --config 'profile.ci.package.sha2.opt-level=0' --test recorder_shutdown -- --nocapture 2>&1 | tee artifacts/logs/baseline-parallel.log
          echo "parallel_exit=${PIPESTATUS[0]}" >> artifacts/logs/workload.txt
          python3 - <<'PY'
          import json, os, pathlib, shutil, tempfile
          output = pathlib.Path('artifacts/logs/failed-children')
          for root in pathlib.Path(tempfile.gettempdir()).glob('grid-shutdown-*'):
              for source in root.rglob('*'):
                  if source.is_file() and source.suffix in ('.log', '.json') and source.stat().st_size < 1000000:
                      target = output / root.name / source.relative_to(root)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, target)
              files = [{'path': str(p.relative_to(root)), 'bytes': p.stat().st_size} for p in root.rglob('*') if p.is_file()]
              target = output / root.name / 'file-sizes.json'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(files, indent=2))
          PY
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          cargo test --all-targets --profile ci 2>&1 | tee artifacts/logs/cargo-test.log
      - name: Clippy
        run: |
          mkdir -p artifacts/logs
          cargo clippy --all-targets --profile ci -- -D warnings 2>&1 | tee artifacts/logs/cargo-clippy.log
      - name: Code limit & complexity gates (codelimit + lizard + clippy)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          brew install codelimit lizard-analyzer
          scripts/check_codelimit.sh HEAD~1 2>&1 | tee artifacts/logs/codelimit.log
      - name: Python syntax
        run: python3 -m compileall -q tools
      - name: Recorder health and provenance tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*provenance*.py' && python3 tools/test_recorder_health.py
      - name: Python asset tests when source collection is present
        run: |
          if [ -d ../carmodels ]; then
            python3 tools/check_assets.py
            python3 tools/test_fleet_assets.py
          else
            echo "SKIP: ../carmodels is not present; source-integrity tests cannot run in CI"
          fi
      - name: Upload retained logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridd-ci-logs
          path: artifacts/logs
          if-no-files-found: warn
