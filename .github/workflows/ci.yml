name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: car_game=debug,bevy_asset=warn,wgpu=error,naga=warn
      CARGO_INCREMENTAL: "0"
      CODELIMIT_CARGO_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1 is the base tip for PR merge commits and the previous commit on push.
          fetch-depth: 2
      - name: Install Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        # Keep new dependency/profile builds between pushes to the same PR.
        # PR merge-ref caches are isolated and cannot replace main's cache.
      - name: Format
        run: |
          mkdir -p artifacts/logs
          cargo fmt --check 2>&1 | tee artifacts/logs/cargo-fmt.log
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          cargo test --locked --all-targets --profile ci 2>&1 | tee artifacts/logs/cargo-test.log
      - name: Clippy
        run: |
          mkdir -p artifacts/logs
          cargo clippy --locked --all-targets --profile ci -- -D warnings 2>&1 | tee artifacts/logs/cargo-clippy.log
      - uses: actions/setup-python@v5
        with:
          # codelimit 0.21 supports Python 3.10–3.14, not the host's future default.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-checks.txt
      - name: Install code quality tools
        run: |
          python3 -m venv "$RUNNER_TEMP/code-quality"
          "$RUNNER_TEMP/code-quality/bin/pip" install --disable-pip-version-check -r tools/requirements-checks.txt
          echo "$RUNNER_TEMP/code-quality/bin" >> "$GITHUB_PATH"
      - name: Code limit & complexity gates (codelimit + lizard + clippy)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          scripts/check_codelimit.sh HEAD~1 2>&1 | tee artifacts/logs/codelimit.log
      - name: Python syntax
        run: python3 -m compileall -q tools
      - name: Recorder health and provenance tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*provenance*.py' && python3 tools/test_recorder_health.py && python3 tools/test_codelimit.py
      - name: Python asset tests when source collection is present
        run: |
          if [ -d ../carmodels ]; then
            python3 tools/check_assets.py
            python3 tools/test_fleet_assets.py
          else
            echo "SKIP: ../carmodels is not present; source-integrity tests cannot run in CI"
          fi
      - name: Upload retained logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridd-ci-logs
          path: artifacts/logs
          if-no-files-found: warn
